<!doctype html><meta charset="utf-8"><canvas id="c" width="900" height="180"></canvas><pre id="result">RUNNING</pre><script src="./airline-logo-data.js"></script>
  <script src="./airline-logos.js"></script><script>
(async()=>{const codes=['SWA','DAL','AAL','UAL','JBU','ASA','UAE','DLH','BAW'];const errors=[];window.addEventListener('error',e=>errors.push(e.message));await AirlineLogos.ready();const c=document.getElementById('c'),ctx=c.getContext('2d');ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);const outcomes=[];for(let i=0;i<codes.length;i++){const f={callsign:codes[i]+'123'};const e=AirlineLogos.preload(f);await new Promise(r=>{if(e.loaded||e.failed)return r();e.image.addEventListener('load',r,{once:true});e.image.addEventListener('error',r,{once:true});});const d=AirlineLogos.drawFit(ctx,f,{x:i*100,y:20,width:95,height:130},{padding:4});outcomes.push({code:codes[i],resolved:AirlineLogos.resolve(f)?.icao,loaded:e.loaded,drawn:!!d?.loaded,w:e.naturalWidth,h:e.naturalHeight});}const pass=outcomes.every(x=>x.resolved===x.code&&x.loaded&&x.drawn)&&errors.length===0;document.getElementById('result').textContent=JSON.stringify({pass,count:AirlineLogos.count(),outcomes,errors});document.title=pass?'PASS':'FAIL';})();
</script>
